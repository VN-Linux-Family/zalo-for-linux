[package]
name = "zwalker"
version = "1.0.0"
edition = "2021"
publish = false

# Linux port of Zalo's macOS `zwalker` NAPI-RS addon (storage garbage collector).
# Dep versions are pinned to the exact set leaked by the mac binary's panic strings
# (see RE-PARAMS.md) so the reconstructed behaviour tracks the original as closely as
# a from-scratch reconstruction can.

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2"
ignore = "=0.4.25"
globset = "=0.4.18"
rayon = "=1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.149"
once_cell = "=1.21.3"
parking_lot = "=0.12.5"
same-file = "=1.0.6"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
