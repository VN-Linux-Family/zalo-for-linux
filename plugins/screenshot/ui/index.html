<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Zalo Screenshot</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const fontUrl = params.get('font');

    if (fontUrl) {
      const style = document.createElement('style');
      style.textContent = `
        @font-face {
          font-family: 'zalo-pc-screencap';
          src: url("${fontUrl}") format('truetype');
          font-weight: normal;
          font-style: normal;
        }
      `;
      document.head.appendChild(style);
    }
  </script>
  <link rel="stylesheet" href="screencap.css">
</head>
<body>
  <div id="canvas-container">
    <canvas id="base-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <canvas id="mask-canvas"></canvas>
  </div>

  <div id="hint-tooltip" data-i18n-key="hint"></div>
  <div id="size-badge"></div>

  <!-- Loupe Magnifier -->
  <div id="loupe">
    <canvas id="loupe-canvas" width="110" height="110"></canvas>
    <div id="loupe-info">X: 0, Y: 0</div>
  </div>

  <!-- Text Editor overlay -->
  <textarea id="text-editor" rows="1"></textarea>

  <!-- Floating Toolbar -->
  <div id="toolbar">
    <button class="tool-btn" data-tool="rect" data-i18n-key="rect" title=""><i class="icon-capture-rec"></i></button>
    <button class="tool-btn" data-tool="circle" data-i18n-key="circle" title=""><i class="icon-capture-circle"></i></button>
    <button class="tool-btn" data-tool="arrow" data-i18n-key="arrow" title=""><i class="icon-capture-arrow"></i></button>
    <button class="tool-btn" data-tool="line" data-i18n-key="line" title=""><i class="icon-capture-line"></i></button>
    <button class="tool-btn" data-tool="doodle" data-i18n-key="doodle" title=""><i class="icon-capture-doodle"></i></button>
    <button class="tool-btn" data-tool="mosaic" data-i18n-key="mosaic" title=""><i class="icon-capture-censored"></i></button>
    <button class="tool-btn" data-tool="text" data-i18n-key="text" title=""><i class="icon-capture-text"></i></button>

    <div class="divider"></div>

    <button class="tool-btn disabled" id="btn-undo" data-i18n-key="undo" title=""><i class="icon-capture-undo"></i></button>
    <button class="tool-btn disabled" id="btn-redo" data-i18n-key="redo" title=""><i class="icon-capture-redo"></i></button>

    <div class="divider"></div>

    <button class="tool-btn" id="btn-save" data-i18n-key="save" title=""><i class="icon-capture-save"></i></button>
    <button class="tool-btn" id="btn-copy" data-i18n-key="copy" title=""><i class="icon-capture-copy"></i></button>
    <button class="tool-btn btn-cancel" id="btn-cancel" data-i18n-key="cancel" title=""><i class="icon-capture-cancel"></i></button>
    <button class="tool-btn btn-accept" id="btn-accept" data-i18n-key="accept" title=""><i class="icon-check"></i></button>
  </div>

  <!-- Sub Toolbar for Tool Options -->
  <div id="sub-toolbar">
    <div class="size-picker">
      <div class="size-dot small" data-size="small" data-i18n-key="small" title=""><div class="size-dot-inner"></div></div>
      <div class="size-dot medium active" data-size="medium" data-i18n-key="medium" title=""><div class="size-dot-inner"></div></div>
      <div class="size-dot large" data-size="large" data-i18n-key="large" title=""><div class="size-dot-inner"></div></div>
    </div>
    <div class="divider"></div>
    <div class="color-palette">
      <div class="color-swatch active" data-color="#e53935" style="background:#e53935;"></div>
      <div class="color-swatch" data-color="#fb8c00" style="background:#fb8c00;"></div>
      <div class="color-swatch" data-color="#fdd835" style="background:#fdd835;"></div>
      <div class="color-swatch" data-color="#43a047" style="background:#43a047;"></div>
      <div class="color-swatch" data-color="#1e88e5" style="background:#1e88e5;"></div>
      <div class="color-swatch" data-color="#8e24aa" style="background:#8e24aa;"></div>
      <div class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></div>
      <div class="color-swatch" data-color="#212121" style="background:#212121;"></div>
    </div>
  </div>

  <script src="screencap.js"></script>
</body>
</html>
