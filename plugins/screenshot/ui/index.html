<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Zalo Screenshot</title>
  <link rel="stylesheet" href="screencap.css">
</head>
<body>
  <div id="canvas-container">
    <canvas id="base-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <canvas id="mask-canvas"></canvas>
  </div>

  <div id="hint-tooltip">Kéo thả chuột để chọn vùng chụp • Nhấp đúp hoặc Enter để hoàn tất • Chuột phải hoặc Esc để hủy</div>
  <div id="size-badge"></div>

  <!-- Loupe Magnifier -->
  <div id="loupe">
    <canvas id="loupe-canvas" width="110" height="110"></canvas>
    <div id="loupe-info">X: 0, Y: 0</div>
  </div>

  <!-- Text Editor overlay -->
  <textarea id="text-editor" rows="1"></textarea>

  <!-- Floating Toolbar -->
  <div id="toolbar">
    <button class="tool-btn" data-tool="rect" title="Vẽ hình chữ nhật"><i class="icon-capture-rec"></i></button>
    <button class="tool-btn" data-tool="circle" title="Vẽ hình elip / tròn"><i class="icon-capture-circle"></i></button>
    <button class="tool-btn" data-tool="arrow" title="Vẽ mũi tên"><i class="icon-capture-arrow"></i></button>
    <button class="tool-btn" data-tool="line" title="Vẽ đường thẳng"><i class="icon-capture-line"></i></button>
    <button class="tool-btn" data-tool="doodle" title="Bút vẽ tự do"><i class="icon-capture-doodle"></i></button>
    <button class="tool-btn" data-tool="mosaic" title="Làm mờ / Che thông tin"><i class="icon-capture-censored"></i></button>
    <button class="tool-btn" data-tool="text" title="Chèn văn bản"><i class="icon-capture-text"></i></button>

    <div class="divider"></div>

    <button class="tool-btn disabled" id="btn-undo" title="Hoàn tác (Ctrl+Z)"><i class="icon-capture-undo"></i></button>
    <button class="tool-btn disabled" id="btn-redo" title="Làm lại (Ctrl+Y)"><i class="icon-capture-redo"></i></button>

    <div class="divider"></div>

    <button class="tool-btn" id="btn-save" title="Lưu thành tệp (Ctrl+S)"><i class="icon-capture-save"></i></button>
    <button class="tool-btn" id="btn-copy" title="Sao chép (Ctrl+C)"><i class="icon-capture-copy"></i></button>
    <button class="tool-btn btn-cancel" id="btn-cancel" title="Hủy (Esc)"><i class="icon-capture-cancel"></i></button>
    <button class="tool-btn btn-accept" id="btn-accept" title="Xong (Enter)"><i class="icon-check"></i></button>
  </div>

  <!-- Sub Toolbar for Tool Options -->
  <div id="sub-toolbar">
    <div class="size-picker">
      <div class="size-dot small" data-size="small" title="Nét mảnh"><div class="size-dot-inner"></div></div>
      <div class="size-dot medium active" data-size="medium" title="Nét vừa"><div class="size-dot-inner"></div></div>
      <div class="size-dot large" data-size="large" title="Nét đậm"><div class="size-dot-inner"></div></div>
    </div>
    <div class="divider"></div>
    <div class="color-palette">
      <div class="color-swatch active" data-color="#e53935" style="background:#e53935;"></div>
      <div class="color-swatch" data-color="#fb8c00" style="background:#fb8c00;"></div>
      <div class="color-swatch" data-color="#fdd835" style="background:#fdd835;"></div>
      <div class="color-swatch" data-color="#43a047" style="background:#43a047;"></div>
      <div class="color-swatch" data-color="#1e88e5" style="background:#1e88e5;"></div>
      <div class="color-swatch" data-color="#8e24aa" style="background:#8e24aa;"></div>
      <div class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></div>
      <div class="color-swatch" data-color="#212121" style="background:#212121;"></div>
    </div>
  </div>

  <script src="screencap.js"></script>
</body>
</html>
