<!DOCTYPE html>
<html lang="vi">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src file: https: data:; font-src file:; media-src file:">
<title>Zalo</title>
<link rel="stylesheet" href="incoming.css">
</head>
<body>
  <button id="close" title="" data-i18n-key="close"><img data-a="close" alt=""></button>
  <div id="avatar"></div>
  <div id="name"></div>
  <div id="sub"></div>
  <div id="buttons">
    <button id="reject" title="" data-i18n-key="reject"><img data-a="end" alt=""></button>
    <button id="accept" title="" data-i18n-key="answer"><img id="acceptIcon" data-a="acceptAudio" alt=""></button>
  </div>
  <button id="noCam" class="hide"><img data-a="camOff" alt=""><span data-i18n-key="answerNoCamera"></span></button>
  <script src="assets.js"></script>
  <script src="i18n.js"></script>
  <script src="incoming.js"></script>
</body>
</html>
