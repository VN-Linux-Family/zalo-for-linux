<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src file:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="../userscripts/manager.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main id="advanced-view" class="settings-view" aria-labelledby="advanced-title">
    <div class="settings-content">
      <header class="settings-heading">
        <span class="eyebrow" data-i18n="eyebrow"></span>
        <h1 id="advanced-title" tabindex="-1" data-i18n="title"></h1>
        <p data-i18n="tagline"></p>
      </header>
      <section class="settings-card" aria-labelledby="sound-title">
        <h2 id="sound-title" data-i18n="soundTitle"></h2>
        <p class="section-description" data-i18n="soundDescription"></p>
        <form class="sound-setting" data-sound="ringtone">
          <label for="ringtone-path" data-i18n="ringtone"></label>
          <p id="ringtone-description" data-i18n="ringtoneDescription"></p>
          <div class="path-row">
            <input id="ringtone-path" name="path" data-i18n-placeholder="defaultZalo" placeholder="" aria-describedby="ringtone-description" autocomplete="off" spellcheck="false">
            <button type="button" class="button" data-action="browse" data-i18n="browse"></button>
          </div>
          <div class="sound-actions">
            <button type="button" class="button" data-action="preview" data-i18n="preview"></button>
            <button type="button" class="button" data-action="reset" data-i18n="reset"></button>
            <button type="submit" class="button primary" data-i18n="save"></button>
          </div>
          <span class="sound-status" role="status" aria-live="polite"></span>
        </form>
        <form class="sound-setting" data-sound="ringback">
          <label for="ringback-path" data-i18n="ringback"></label>
          <p id="ringback-description" data-i18n="ringbackDescription"></p>
          <div class="path-row">
            <input id="ringback-path" name="path" data-i18n-placeholder="defaultZalo" placeholder="" aria-describedby="ringback-description" autocomplete="off" spellcheck="false">
            <button type="button" class="button" data-action="browse" data-i18n="browse"></button>
          </div>
          <div class="sound-actions">
            <button type="button" class="button" data-action="preview" data-i18n="preview"></button>
            <button type="button" class="button" data-action="reset" data-i18n="reset"></button>
            <button type="submit" class="button primary" data-i18n="save"></button>
          </div>
          <span class="sound-status" role="status" aria-live="polite"></span>
        </form>
        <p class="sound-hint" data-i18n="soundHint"></p>
      </section>
      <section class="settings-card" aria-labelledby="screenshot-title">
        <h2 id="screenshot-title" data-i18n="screenshotTitle"></h2>
        <p class="section-description" data-i18n="screenshotDescription"></p>
        <form class="screenshot-setting" data-screenshot-delay="withZalo">
          <label for="delay-with-zalo" data-i18n="withZalo"></label>
          <p id="delay-with-zalo-desc" data-i18n="withZaloDescription"></p>
          <div class="delay-row">
            <input type="number" id="delay-with-zalo" name="delay" min="0" max="10000" step="50" placeholder="100" aria-describedby="delay-with-zalo-desc" autocomplete="off">
            <span class="unit" data-i18n="managerMsUnit"></span>
            <div class="delay-actions">
              <button type="button" class="button" data-action="reset" data-i18n="reset"></button>
              <button type="submit" class="button primary" data-i18n="save"></button>
            </div>
          </div>
          <span class="screenshot-status" role="status" aria-live="polite"></span>
        </form>
        <form class="screenshot-setting" data-screenshot-delay="withoutZalo">
          <label for="delay-without-zalo" data-i18n="withoutZalo"></label>
          <p id="delay-without-zalo-desc" data-i18n="withoutZaloDescription"></p>
          <div class="delay-row">
            <input type="number" id="delay-without-zalo" name="delay" min="0" max="10000" step="50" placeholder="500" aria-describedby="delay-without-zalo-desc" autocomplete="off">
            <span class="unit" data-i18n="managerMsUnit"></span>
            <div class="delay-actions">
              <button type="button" class="button" data-action="reset" data-i18n="reset"></button>
              <button type="submit" class="button primary" data-i18n="save"></button>
            </div>
          </div>
          <span class="screenshot-status" role="status" aria-live="polite"></span>
        </form>
        <p class="sound-hint" data-i18n="delayHint"></p>
      </section>
      <section class="settings-card" aria-labelledby="recalled-title">
        <div class="toggle-row">
          <div>
            <h2 id="recalled-title" data-i18n="recalledTitle"></h2>
            <p id="recalled-description" class="section-description" data-i18n="recalledDescription"></p>
          </div>
          <label class="toggle-label"><span class="visually-hidden" data-i18n="recalledTitle"></span><input id="keep-recalled" type="checkbox" aria-describedby="recalled-description recalled-hint"><i></i></label>
        </div>
        <p id="recalled-hint" class="toggle-hint" data-i18n="recalledHint"></p>
        <span id="recalled-status" class="sound-status" role="status" aria-live="polite"></span>
      </section>
      <section class="settings-card userscripts-card" aria-labelledby="userscripts-title">
        <div class="brand-icon" aria-hidden="true">&lt;/&gt;</div>
        <div class="userscripts-description"><h2 id="userscripts-title" data-i18n="userscriptsTitle"></h2><p data-i18n="userscriptsDescription"></p></div>
        <button id="open-userscripts" class="button"><span data-i18n="openManager"></span> <span aria-hidden="true">→</span></button>
      </section>
      <section class="settings-card" aria-labelledby="dev-mode-title">
        <div class="toggle-row">
          <div>
            <h2 id="dev-mode-title" data-i18n="devModeTitle"></h2>
          </div>
          <label class="toggle-label"><span class="visually-hidden" data-i18n="devModeTitle"></span><input id="dev-mode" type="checkbox" aria-describedby="dev-mode-status"><i></i></label>
        </div>
        <p id="dev-mode-status" class="sound-status" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <section id="userscripts-view" class="settings-view" data-i18n-plugin="userscripts" data-i18n-aria-label="managerWindowLabel" aria-label="" inert aria-hidden="true">
    <header class="manager-navigation">
      <button id="back-to-advanced" class="button" type="button" data-i18n="back"></button>
      <span data-i18n="managerNavTitle"></span>
    </header>
    <div class="manager-layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">&lt;/&gt;</div>
      <div><h1 data-i18n="managerBrand"></h1><p data-i18n="injectScripts"></p></div>
    </div>
    <div class="toolbar">
      <button id="create-button" class="button primary" data-i18n="create"></button>
      <button id="import-button" class="button" data-i18n="import"></button>
    </div>
    <label class="search"><span>⌕</span><input id="search-input" data-i18n-placeholder="search" placeholder=""></label>
    <div id="script-list" class="script-list"></div>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">JS</div>
      <strong data-i18n="empty"></strong>
      <span data-i18n="emptyHint"></span>
    </div>
  </aside>

  <main class="editor-pane">
    <section id="welcome" class="welcome">
      <div class="welcome-icon">{ }</div>
      <h2 data-i18n="managerWelcome"></h2>
      <p data-i18n="managerWelcomeHint"></p>
      <p class="warning" data-i18n="managerWarning"></p>
    </section>

    <form id="editor" class="editor hidden">
      <header class="editor-header">
        <div class="name-field">
          <label for="script-name" data-i18n="scriptName"></label>
          <input id="script-name" maxlength="160" required data-i18n-placeholder="managerScriptNamePlaceholder" placeholder="">
        </div>
        <label class="toggle-label"><span data-i18n="enabled"></span><input id="script-enabled" type="checkbox"><i></i></label>
      </header>
      <div class="editor-meta">
        <span data-i18n="metadata"></span> <code>@name</code>, <code>@description</code>, <code>@version</code>,
        <code>@match</code>, <code>@include</code>, <code>@exclude</code>.
      </div>
      <textarea id="script-code" spellcheck="false" data-i18n-aria-label="managerEditorAria" aria-label=""></textarea>
      <footer class="editor-footer">
        <span id="status-text" data-i18n="appliedNext"></span>
        <div class="actions">
          <button id="delete-button" type="button" class="button danger" data-i18n="delete"></button>
          <button id="cancel-button" type="button" class="button" data-i18n="cancel"></button>
          <button type="submit" class="button primary" data-i18n="saveCode"></button>
        </div>
      </footer>
    </form>
  </main>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <script src="../userscripts/manager.js"></script>
  <script src="settings.js"></script>
</body>
</html>
