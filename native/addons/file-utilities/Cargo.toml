[package]
name = "file-utilities"
version = "1.0.0"
edition = "2021"
license.workspace = true
[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi5", "async"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs"] }
globset = "0.4"
walkdir = "2"
rustix = { version = "1", features = ["fs", "linux_5_11"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true