[package]
name = "zimage"
version = "1.0.0"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi5", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "ico"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
