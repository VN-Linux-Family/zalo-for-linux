[package]
name = "zwalker"
version = "1.0.0"
edition = "2021"
publish = false

# Linux port of Zalo's macOS `zwalker` NAPI-RS addon (storage garbage collector).
# Dep versions are pinned to the exact set leaked by the mac binary's panic strings
# (see RE-PARAMS.md) so the reconstructed behaviour tracks the original as closely as
# a from-scratch reconstruction can.

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16", default-features = false, features = ["napi8"] }
napi-derive = "3"
ignore = "0.4.35"
globset = "0.4.22"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
parking_lot = "0.13.0"
same-file = "1.0.6"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
