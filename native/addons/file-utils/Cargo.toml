[package]
name = "file-utils"
version = "1.0.0"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi5", "async"] }
napi-derive = "2"
rustix = { version = "1", features = ["fs"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true