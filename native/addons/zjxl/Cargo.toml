[package]
name = "zjxl"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Node-API v5 is deliberately the only Node-API level enabled.
napi = { version = "3", default-features = false, features = ["napi5"] }
napi-derive = "3"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["rayon"] }
jxl-encoder = "0.3.4"
jpeg-encoder = "0.7.1"
fast_image_resize = "6.2.0"
jxl-encoder-simd = "0.3.4"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
