[package]
name = "os-sys-info"
version = "0.1.0"
edition = "2021"
description = "Linux OS architecture and process snapshots"

[lib]
name = "os_sys_info"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi5"] }
napi-derive = "3"
rustix = { version = "1", features = ["linux_5_11", "param", "system"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
