name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nativelibs/*/target
            zocr/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('nativelibs/*/Cargo.lock', 'zocr/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Node.js tests
        run: npm test

      - name: Run Rust crate tests
        run: |
          for cargo in zocr/Cargo.toml nativelibs/*/Cargo.toml; do
            cargo test --manifest-path "$cargo" --locked
          done
