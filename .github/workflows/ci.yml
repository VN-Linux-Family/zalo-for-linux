name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Test & Lint Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus-dev libpulse-dev ninja-build python3-pip pkg-config cmake

      - name: Cache WebRTC APM (v1.3)
        id: webrtc-apm
        uses: actions/cache@v6
        with:
          path: /opt/webrtc-apm
          key: ${{ runner.os }}-x64-webrtc-apm-1.3-v2

      - name: Build WebRTC AudioProcessing v1.3 (static)
        if: steps.webrtc-apm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo pip3 install --no-cache-dir "meson>=0.63"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          sudo mkdir -p /opt/webrtc-apm
          sudo chown "$(id -u):$(id -g)" /opt/webrtc-apm
          curl -fsSL "https://github.com/abseil/abseil-cpp/releases/download/20240116.2/abseil-cpp-20240116.2.tar.gz" -o "$tmpdir/absl.tar.gz"
          tar -xf "$tmpdir/absl.tar.gz" -C "$tmpdir"
          cmake -S "$tmpdir/abseil-cpp-20240116.2" -B "$tmpdir/absl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/webrtc-apm \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DABSL_PROPAGATE_CXX_STD=ON \
            -DABSL_BUILD_TESTING=OFF
          cmake --build "$tmpdir/absl-build" --target install
          export PKG_CONFIG_PATH="/opt/webrtc-apm/lib/pkgconfig:/opt/webrtc-apm/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          curl -fsSL "https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/webrtc-audio-processing-1.3.tar.xz" -o "$tmpdir/webrtc.tar.xz"
          tar -xf "$tmpdir/webrtc.tar.xz" -C "$tmpdir"
          meson setup "$tmpdir/build" "$tmpdir/webrtc-audio-processing-1.3" \
            --prefix=/opt/webrtc-apm \
            --buildtype=release \
            --default-library=static \
            -Dcpp_std=c++17 \
            -Dcpp_args="-include cstdint"
          ninja -C "$tmpdir/build" install

      - name: Configure WebRTC APM pkg-config
        run: |
          echo "PKG_CONFIG_PATH=/opt/webrtc-apm/lib/pkgconfig:/opt/webrtc-apm/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Security audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Node.js tests
        run: npm test

      - name: Run Rust crate tests
        run: cargo test --workspace --locked
