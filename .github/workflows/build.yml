name: Build Zalo for Linux

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo Version (leave empty for latest)'
        required: false
        default: ''
        type: string
      zalo_win_version:
        description: 'Zalo Windows Version for OCR (leave empty for latest)'
        required: false
        default: ''
        type: string
      zadark_version:
        description: 'ZaDark Version/Tag/Commit (leave empty for latest)'
        required: false
        default: ''
        type: string
      force_build:
        description: 'Rebuild even when this version/commit combination already exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    outputs:
      zalo_version: ${{ steps.build.outputs.zalo_version }}
      build: ${{ steps.build.outputs.build }}
      original_appimage_name: ${{ steps.build.outputs.original_appimage_name }}
      original_appimage_file: ${{ steps.build.outputs.original_appimage_file }}
      zadark_appimage_name: ${{ steps.build.outputs.zadark_appimage_name }}
      zadark_appimage_file: ${{ steps.build.outputs.zadark_appimage_file }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            sys_deps: >
              apt update &&
              apt install -y git curl wget ca-certificates xz-utils python3 build-essential libssl-dev liblzma-dev p7zip-full gcc g++ clang libclang-dev llvm libc6-dev libx11-dev libxcb1-dev libxext-dev zlib1g-dev zsync rpm libarchive-tools
          - arch: aarch64
            runner: ubuntu-24.04-arm
            sys_deps: >
              apt update &&
              apt install -y git curl wget ca-certificates xz-utils python3 build-essential libssl-dev liblzma-dev p7zip-full gcc g++ clang libclang-dev llvm libc6-dev libx11-dev libxcb1-dev libxext-dev zlib1g-dev zsync rpm libarchive-tools
    steps:
    - name: Install system build dependencies (${{ matrix.arch }})
      run: ${{ matrix.sys_deps }}
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Trust workspace repositories in container
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/plugins/zadark"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Electron binaries
      uses: actions/cache@v3
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ matrix.arch }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-electron-

    - name: Cache build downloads
      uses: actions/cache@v3
      with:
        path: temp
        key: ${{ runner.os }}-${{ matrix.arch }}-zalo-temp-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-zalo-temp-

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          nativelibs/*/target
        key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('nativelibs/*/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-cargo-

    - name: Install Node.js dependencies
      run: npm ci --prefer-offline --no-audit --build-from-source=sqlite3 --napi_build_version=6

    - name: Check Linux packaging logic
      run: node --test scripts/build-linux-packages.test.js

    - name: Setup and Build
      id: build
      env:
        ZALO_VERSION: ${{ github.event.inputs.zalo_version }}
        ZALO_WIN_VERSION: ${{ github.event.inputs.zalo_win_version }}
        ZADARK_VERSION: ${{ github.event.inputs.zadark_version }}
        FORCE_BUILD: ${{ github.event.inputs.force_build }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npm run main

    - name: Upload Original AppImage artifact
      if: steps.build.outputs.build == 'true' && steps.build.outputs.original_appimage_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.original_appimage_name }}-${{ matrix.arch }}
        path: ${{ steps.build.outputs.original_appimage_file }}*
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

    - name: Upload ZaDark AppImage artifact
      if: steps.build.outputs.build == 'true' && steps.build.outputs.zadark_appimage_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.zadark_appimage_name }}-${{ matrix.arch }}
        path: ${{ steps.build.outputs.zadark_appimage_file }}*
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

    - name: Upload native packages and archives
      if: steps.build.outputs.build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Zalo-packages-${{ matrix.arch }}
        path: |
          dist/*.deb
          dist/*.rpm
          dist/*.pkg.tar.xz
          dist/*-portable-*.tar.xz
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  distro-install:
    name: Install on ${{ matrix.distro }} (${{ matrix.arch }})
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:22.04
            arch: x86_64
            runner: ubuntu-latest
          - distro: ubuntu
            image: ubuntu:24.04
            arch: x86_64
            runner: ubuntu-latest
          - distro: ubuntu
            image: ubuntu:22.04
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: debian
            image: debian:bookworm
            arch: x86_64
            runner: ubuntu-latest
          - distro: fedora
            image: fedora:latest
            arch: x86_64
            runner: ubuntu-latest
          - distro: fedora
            image: fedora:latest
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            arch: x86_64
            runner: ubuntu-latest
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            arch: aarch64
            runner: ubuntu-24.04-arm
          - distro: arch
            image: archlinux:base
            arch: x86_64
            runner: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: Zalo-packages-${{ matrix.arch }}
        path: packages
    - name: Check native installation and portable archive
      run: bash scripts/check-linux-install.sh "${{ matrix.distro }}" packages

  release:
    name: Release the packages
    needs: [build, distro-install, package-repository]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.build.result == 'success' && needs.distro-install.result == 'success' &&
      (needs.package-repository.result == 'success' || needs.package-repository.result == 'skipped') &&
      needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Download all package artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: Zalo*
        path: dist
        merge-multiple: true

    - name: Add signed repository assets
      if: needs.package-repository.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: repository-assets
        path: dist

    - name: Get the commit the build is named after
      run: echo "COMMIT_HASH=$(node scripts/utils/build-commit.js)" >> "$GITHUB_ENV"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.zalo_version }}
        name: ${{ needs.build.outputs.zalo_version }}
        body: |
          ## 🚀 How to use

          Download one package for your architecture (`x86_64` or `aarch64`) and variant (Original or ZaDark):

          - Debian / Ubuntu / Mint: `sudo apt install ./Zalo-*-deb-*.deb`
          - Fedora: `sudo dnf install ./Zalo-*-fedora-*.rpm`
          - openSUSE: `sudo zypper install ./Zalo-*-opensuse-*.rpm`
          - Arch / Manjaro: `sudo pacman -U ./Zalo-*-arch-*.pkg.tar.xz`
          - Other compatible glibc systems: extract the `*-portable-*.tar.xz` and run `./zalo` in the extracted directory (system libraries are required).

          Keep only your chosen variant/version in the current directory. Native packages add Zalo to the application menu. Quit Zalo and install a newer package with the same command to update. For system updates and variant selection, upstream maintainers can enable the optional signed repository pipeline documented in packaging/repository/README.md. Local downloads alone do not configure an update repository.

          It is recommended to use [Gear Lever](https://github.com/mijorus/gearlever) or [AM](https://github.com/ivan-hc/AM) to manage and integrate the AppImage.

          Choose the appropriate AppImage for your system architecture below (x64 or aa64) and download it.

          ```bash
          # Install with Gear Lever
          flatpak run it.mijorus.gearlever --integrate <downloaded-file>
          ```

          Or you can run the AppImage manually:

          ```bash
          chmod +x <downloaded-file> # Get the filename with ls, or you can use your file manager's GUI
          ./<downloaded-file>
          ```

          > 📞 **Calls** (voice, video, screen sharing, group calls) run on a native Linux engine inside every AppImage: no Wine, no download. They need `python3`, libopus and the PulseAudio tools (Debian / Ubuntu: `sudo apt install python3 libopus0 pulseaudio-utils`); the first call says what is missing.

          **NOTE: DO NOT download the files with `.AppImage.zsync`, they are only used for delta updates and cannot run directly.**

          ## 📋 System Requirements
          - Linux x64 or aa64
          - GLIBC 2.35 or later

          ## 🐛 Issues & Support
          Please report issues in the [GitHub Issues](https://github.com/${{ github.repository }}/issues) section.

        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup old release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.build.outputs.zalo_version }}
        CURRENT_COMMIT: ${{ env.COMMIT_HASH }}
      run: |
        set -euo pipefail

        echo "Cleaning up assets for release $RELEASE_TAG (keeping current build artifacts)"

        asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

        if [ -z "$asset_names" ]; then
          echo "No assets found for release $RELEASE_TAG"
          exit 0
        fi

        for name in $asset_names; do
          if [[ "$name" == Zalo-*.AppImage* || "$name" == Zalo-*.rpm || "$name" == Zalo-*.deb || "$name" == Zalo-*.tar.xz ]] && [[ ! -f "dist/$name" ]]; then
            echo "Removing old asset: $name"
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          fi
        done

    # The flake pins the AppImages by name and hash, and the step above has just
    # deleted the ones it pointed to. A push made with GITHUB_TOKEN does not
    # start another run, so this does not rebuild the release.
    - name: Update Nix sources
      if: github.ref == 'refs/heads/main'
      env:
        RELEASE_TAG: ${{ needs.build.outputs.zalo_version }}
        CURRENT_COMMIT: ${{ env.COMMIT_HASH }}
      run: |
        set -euo pipefail

        scripts/update-nix-sources.sh "$RELEASE_TAG" dist nix/sources.json

        if git diff --quiet -- nix/sources.json; then
          echo "nix/sources.json is up to date"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add nix/sources.json
        git commit -m "chore(nix): update sources for $RELEASE_TAG ($CURRENT_COMMIT)"

        git fetch origin main
        if git rebase FETCH_HEAD && git push origin HEAD:main; then
          echo "Pushed nix/sources.json"
        else
          echo "::warning::Could not push nix/sources.json; the flake still points to the deleted assets"
        fi

  package-repository:
    needs: [build, distro-install]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.build == 'true' && vars.REPO_ENABLED == 'true'
    uses: ./.github/workflows/publish-repository.yml
    secrets: inherit

  deploy-repository-pages:
    name: Deploy package repository to GitHub Pages
    needs: [release, package-repository]
    if: always() && needs.release.result == 'success' && needs.package-repository.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v5
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
