name: Build Zalo for Linux

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo Version (leave empty for latest)'
        required: false
        default: ''
        type: string
      zalo_win_version:
        description: 'Zalo Windows Version for OCR (leave empty for latest)'
        required: false
        default: ''
        type: string
      zadark_version:
        description: 'ZaDark Version/Tag/Commit (leave empty for latest)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    outputs:
      zalo_version: ${{ steps.build.outputs.zalo_version }}
      build: ${{ steps.build.outputs.build }}
      original_appimage_name: ${{ steps.build.outputs.original_appimage_name }}
      original_appimage_file: ${{ steps.build.outputs.original_appimage_file }}
      zadark_appimage_name: ${{ steps.build.outputs.zadark_appimage_name }}
      zadark_appimage_file: ${{ steps.build.outputs.zadark_appimage_file }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      NODE_VERSION: '22'
    steps:
    # ubuntu:22.04 ships without git, which actions/checkout needs.
    - name: Bootstrap apt (git for checkout)
      run: |
        set -euo pipefail
        # ubuntu images delete downloaded .debs after install, which leaves the
        # apt archive cache below empty. Drop the hook so the cache has content.
        rm -f /etc/apt/apt.conf.d/docker-clean
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Trust workspace repositories in container
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/plugins/zadark"

    # The package list lives in .github/apt-packages.txt, so its hash is a
    # stable cache key. Lists are intentionally not cached: the bootstrap step
    # already refreshed them in this run.
    - name: Cache apt archives
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives
        # v2: invalidates the empty archives saved before docker-clean was dropped.
        key: ${{ runner.os }}-${{ matrix.arch }}-apt-v2-${{ hashFiles('.github/apt-packages.txt') }}

    - name: Install system build dependencies (${{ matrix.arch }})
      run: |
        set -euo pipefail
        grep -vE '^[[:space:]]*(#|$)' .github/apt-packages.txt \
          | xargs apt-get install -y --no-install-recommends

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Electron binaries
      uses: actions/cache@v6
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ matrix.arch }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-electron-

    - name: Resolve Zalo version for cache key
      id: zalo
      env:
        REQUESTED_ZALO_VERSION: ${{ github.event.inputs.zalo_version }}
      run: |
        set -euo pipefail
        version="${REQUESTED_ZALO_VERSION:-}"
        if [ -z "$version" ]; then
          version="$(node scripts/check-versions.js --print-zalo-version)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Cache only the downloaded installers. temp/ also holds extracted trees
    # (~1.15GB) that prepare-app.js deletes on every run.
    - name: Restore Zalo installers
      id: zalo-installers
      uses: actions/cache/restore@v6
      with:
        path: |
          temp/*.dmg
          temp/*.exe
          temp/*.tgz
        key: ${{ runner.os }}-${{ matrix.arch }}-zalo-${{ steps.zalo.outputs.version }}

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-cargo-

    - name: Cache Node.js modules
      id: node-modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ matrix.arch }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

    - name: Install Node.js dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci --prefer-offline --no-audit --build-from-source=sqlite3 --napi_build_version=6

    - name: Setup and Build
      id: build
      env:
        # Already resolved above for the cache key; avoids a second lookup.
        ZALO_VERSION: ${{ steps.zalo.outputs.version }}
        ZALO_WIN_VERSION: ${{ github.event.inputs.zalo_win_version }}
        ZADARK_VERSION: ${{ github.event.inputs.zadark_version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: npm run main

    - name: Save Zalo installers
      if: steps.zalo-installers.outputs.cache-hit != 'true' && steps.build.outputs.build == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          temp/*.dmg
          temp/*.exe
          temp/*.tgz
        key: ${{ runner.os }}-${{ matrix.arch }}-zalo-${{ steps.zalo.outputs.version }}

    - name: Upload Original AppImage artifact
      if: steps.build.outputs.build == 'true' && steps.build.outputs.original_appimage_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.original_appimage_name }}
        path: ${{ steps.build.outputs.original_appimage_file }}*
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

    - name: Upload ZaDark AppImage artifact
      if: steps.build.outputs.build == 'true' && steps.build.outputs.zadark_appimage_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.zadark_appimage_name }}
        path: ${{ steps.build.outputs.zadark_appimage_file }}*
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}


  release:
    name: Release the AppImages
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Download all AppImage artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: Zalo*
        path: dist
        merge-multiple: true

    - name: Get the commit the build is named after
      run: echo "COMMIT_HASH=$(node scripts/utils/build-commit.js)" >> "$GITHUB_ENV"

    - name: Generate Categorized Release Notes
      run: node scripts/utils/generate-release-notes.js "${{ needs.build.outputs.zalo_version }}" dist/release-body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.zalo_version }}
        name: ${{ needs.build.outputs.zalo_version }}
        body_path: dist/release-body.md
        generate_release_notes: false
        files: dist/*.AppImage*
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Cleanup old release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.build.outputs.zalo_version }}
        CURRENT_COMMIT: ${{ env.COMMIT_HASH }}
      run: |
        set -euo pipefail

        echo "Cleaning up assets for release $RELEASE_TAG (keeping commit $CURRENT_COMMIT)"

        asset_names=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

        if [ -z "$asset_names" ]; then
          echo "No assets found for release $RELEASE_TAG"
          exit 0
        fi

        for name in $asset_names; do
          if [[ "$name" == Zalo-*.AppImage* ]] && [[ "$name" != *"$CURRENT_COMMIT"* ]]; then
            echo "Removing old asset: $name"
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
          fi
        done

    # The flake pins the AppImages by name and hash, and the step above has just
    # deleted the ones it pointed to. A push made with GITHUB_TOKEN does not
    # start another run, so this does not rebuild the release.
    - name: Update Nix sources
      if: github.ref == 'refs/heads/main'
      env:
        RELEASE_TAG: ${{ needs.build.outputs.zalo_version }}
        CURRENT_COMMIT: ${{ env.COMMIT_HASH }}
      run: |
        set -euo pipefail

        scripts/update-nix-sources.sh "$RELEASE_TAG" dist nix/sources.json

        if git diff --quiet -- nix/sources.json; then
          echo "nix/sources.json is up to date"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add nix/sources.json
        git commit -m "chore(nix): update sources for $RELEASE_TAG ($CURRENT_COMMIT)"

        git fetch origin main
        if git rebase FETCH_HEAD && git push origin HEAD:main; then
          echo "Pushed nix/sources.json"
        else
          echo "::warning::Could not push nix/sources.json; the flake still points to the deleted assets"
        fi
