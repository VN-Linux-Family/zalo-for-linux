[workspace]
members = [
    "native/addons/file-utilities",
    "native/addons/file-utils",
    "native/addons/mp4thumb",
    "native/addons/os-sys-info",
    "native/addons/zimage",
    "native/addons/zjxl",
    "native/addons/zlang",
    "native/addons/zwalker",
    "native/addons/zfile",
    "native/addons/db-cross-v4",
    "native/engines/zocr",
    "native/engines/zcall",
]
resolver = "2"

[workspace.package]
license = "BSD-3-Clause"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

pedantic = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"