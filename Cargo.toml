[workspace]
members = [
    "native/addons/file-utilities",
    "native/addons/file-utils",
    "native/addons/mp4thumb",
    "native/addons/os-sys-info",
    "native/addons/zimage",
    "native/addons/zjxl",
    "native/addons/zlang",
    "native/addons/zwalker",
    "native/addons/zfile",
    "native/engines/zocr",
    "native/engines/zcall/audio",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
